<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vishu &amp; Kavya — Wedding Invitation</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="preload" as="image" href="images/meenaya-canvas-bg.webp" type="image/webp">
  <link rel="preload" as="image" href="images/meenaya-lamps.webp" type="image/webp">
  <link rel="preload" as="image" href="images/meenaya-temple-sticker.webp" type="image/webp">
  <link rel="stylesheet" href="meenaya.css?v=2">
</head>
<body class="motion-ready">
  <!-- Background Music -->
  <audio id="weddingAudio" src="audio/wedding-music.mp3?v=2" preload="none" loop playsinline></audio>

  <div class="site-shell">
    <!-- HERO SECTION WITH SCROLL TRAVEL -->
    <section class="hero" id="hero">
      <div class="hero-sticky" id="heroStage">
        
        <!-- 1. Pure Blue Painted Canvas Background (Completely Clean) -->
        <div class="hero-bg-wrap">
          <img src="images/meenaya-canvas-bg.webp" alt="Painted Blue Night Sky" class="hero-bg" fetchpriority="high">
        </div>

        <!-- 2. Floating Sky Lamps Layer (Comes DOWN as user scrolls) -->
        <div class="hero-lamps-wrap" id="heroLampsWrap">
          <img src="images/meenaya-lamps.webp" alt="Glowing Sky Lanterns" class="hero-lamps" fetchpriority="high">
        </div>

        <!-- 3. Couple Typography (Centered, crisp single rendering, zero duplicate text) -->
        <div class="hero-title" id="heroTitle">
          <h1 class="groom-name">VISHU</h1>
          <div class="weds-wrap">
            <span class="weds-text">W E D S</span>
          </div>
          <h1 class="bride-name">KAVYA</h1>
          <p class="invite-subtitle">WE INVITE YOU TO CELEBRATE OUR WEDDING</p>
        </div>

        <!-- 4. Temple Sticker (Ascends UP as user scrolls) -->
        <div class="hero-temple-wrap" id="heroTempleWrap">
          <img src="images/meenaya-temple-sticker.webp" alt="Sacred Dravidian Gopuram" class="hero-temple" id="heroTemple" fetchpriority="high">
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-cue" id="heroScrollCue" role="button" tabindex="0" aria-label="Tap to enter wedding invitation and play music">
          <span>SCROLL TO EXPLORE</span>
          <div class="scroll-mouse"><span class="wheel"></span></div>
        </div>

        <!-- Discreet Audio Pill Button -->
        <button id="audioToggle" class="audio-pill-btn" aria-label="Toggle background music">
          <span class="audio-bars">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="audio-label">MUSIC</span>
        </button>

        <!-- Subtle Ambient Vignette -->
        <div class="hero-vignette" aria-hidden="true"></div>
      </div>
    </section>
  </div>

  <script type="module" src="meenaya.js?v=2"></script>
</body>
</html>
